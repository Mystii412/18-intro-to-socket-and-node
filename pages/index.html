<!doctype html>
<html>
  <head>
    <title>Discord 3</title>
    <style>
      body {
        margin: 0;
        padding-bottom: 3rem;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
 
      #form {
        background: rgba(0, 0, 0, 0.15);
        padding: 0.25rem;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        height: 3rem;
        box-sizing: border-box;
        backdrop-filter: blur(10px);
      }
      #input {
        border: none;
        padding: 0 1rem;
        flex-grow: 1;
        border-radius: 2rem;
        margin: 0.25rem;
      }
      #input:focus {
        outline: none;
      }
      #form > button {
        background: #333;
        border: none;
        padding: 0 1rem;
        margin: 0.25rem;
        border-radius: 3px;
        outline: none;
        color: #fff;
      }
 
      #messages {
        list-style-type: none;
        margin: 0;
        padding: 0;
      }
      #messages > li {
        padding: 0.5rem 1rem;
      }
      #messages > li:nth-child(odd) {
        background: #efefef;
      }
    </style>
  </head>
  <body>
    <ul id="messages"></ul>
    <form id="form" action="">
      <input id="input" autocomplete="off" />
      <input type="file" id="file" accept=".jpg, .png, .gif, .bmp, .jpeg, .webp" />
      <button>send</button>
    </form>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        let username = prompt("enter your name f")
      var socket = io();
 
      let form = document.getElementById("form");
      let input = document.getElementById("input");
      let messages = document.getElementById("messages")
      let file = document.getElementById('file')

        socket.emit("set username", username)
      form.addEventListener("submit", function(event){
        event.preventDefault();
        if(input.value.trim()){
            socket.emit("chat message", input.value.trim());
            input.value = ""
        }
        if (file.files.length > 0) {
                    var data = file.files[0];
                    var reader = new FileReader();
                    reader.onload = function (evt) {
                        var msg = {};
                        msg.file = evt.target.result;
                        msg.fileName = data.name;
                        socket.emit("base64 file", msg);
                        console.log(msg);
                    };
                    reader.readAsDataURL(data);
                } else {
                    console.log("no file selected");
                }
      })

      socket.on("base64 image", (msg) => {
                console.log("as", msg);
                const li = document.createElement("li");
                const img = document.createElement("img");
                img.src = msg.file;
                li.append(img);
                messages.append(li);
                img.style.maxWidth = "400px"

                //scrollToBottom();
            });


                socket.on("base64 file", function (msg) {
        console.log("received base64 file from server: " + msg.fileName);
        socket.username = msg.username;
        io.emit(
            "base64 image", //exclude sender
            // io.sockets.emit(
            //   "base64 file", //include sender

            {
                file: msg.file,
                fileName: msg.fileName,
            },
        );
    });

      
 
      socket.on("message", function(data){
        let item = document.createElement("li");
        item.textContent = data.user + ": " + data.text
        messages.append(item)
      })
    </script>
  </body>
</html>
